[env]
# DATABASE_URL is used by sqlx CLI tools and integration tests (not the server)
DATABASE_URL = "postgres://rustyfin:rustyfin@localhost:5432/rustyfin_dev"
RUSTYFIN__DATABASE__PASSWORD = "rustyfin"
RUSTYFIN__DATABASE__USER = "rustyfin"

[tools]
node = "22"
# mr_boxington makes mise run every cargo command through mbx (a shared compile cache).
# The option has to be on this entry: a rust version taken from rust-toolchain.toml
# alone would drop it. wasm32 is for the frontend (trunk), as in rust-toolchain.toml.
rust = { version = "1.100.0", mr_boxington = true, components = "clippy,rustfmt", targets = "wasm32-unknown-unknown" }
mr-boxington = "latest"
# What hk.pkl's steps call, declared here so `format`/`lint` do not depend on
# a tool that happens to be installed globally. rustfmt comes with the rust
# entry above.
hk = "latest"
oxfmt = "latest"    # hk: frontend HTML and CSS
rumdl = "latest"    # hk: Markdown, configured in .rumdl.toml
shfmt = "latest"
shellcheck = "latest"
shellharden = "latest"
yamlfmt = "latest"  # hk: YAML, configured in .yamlfmt
zizmor = "latest"   # hk: GitHub Actions security audit

# ── Dev ──────────────────────────────────────────────────────
[tasks.dev]
depends = ["docker:up"]
description = "Start dev environment (docker compose + server)"
run = "trap 'exit 0' INT; cargo run --bin rustyfin-server"

# ── Server ───────────────────────────────────────────────────
[tasks.server]
description = "Run the rustyfin server"
run = "trap 'exit 0' INT; cargo run --bin rustyfin-server"

[tasks."server:watch"]
description = "Run the server with auto-reload on changes"
run = "trap 'exit 0' INT; cargo watch -x 'run --bin rustyfin-server'"

# ── Frontend ─────────────────────────────────────────────────
[tasks.frontend]
description = "Serve the Sycamore frontend with Trunk (dev mode, access via localhost:8097/web/)"
dir = "frontend"
run = "trap 'exit 0' INT; trunk serve"

[tasks."frontend:build"]
description = "Build the frontend for production"
dir = "frontend"
run = "trunk build --release"

# ── Database ─────────────────────────────────────────────────
[tasks."db:migrate"]
description = "Run database migrations"
run = "cargo sqlx migrate run --source migrations"

[tasks."db:reset"]
description = "Reset database and re-run migrations"
run = "sqlx database drop -y && sqlx database create && sqlx migrate run --source migrations"

[tasks."db:prepare"]
description = "Generate sqlx offline query data"
run = "cargo sqlx prepare --workspace"

# ── Test ─────────────────────────────────────────────────────
[tasks.test]
depends = ["test:*"]
description = "Run all tests"

[tasks."test:unit"]
description = "Run unit tests (#[cfg(test)] modules)"
run = "cargo test --lib"

[tasks."test:integration"]
description = "Run integration tests (requires Postgres)"
run = "cargo test -p rustyfin-jellyfin --test '*' -- --test-threads=1"

[tasks.bench]
description = "Benchmark: scan and browse a generated library (docs/performance.md); args after --, e.g. -- --scale 0.1"
# Needs DATABASE_URL to name a Postgres role that may create databases, and
# ffprobe on PATH (and meilisearch for `-- --meilisearch`). The release builds
# are what the numbers describe.
run = "cargo build --release --locked -p rustyfin-server -p rustyfin-bench && target/release/rustyfin-bench"

# ── Format & lint ────────────────────────────────────────────
# Both go through hk, so the steps live in one place: hk.pkl.
[tasks.format]
description = "Format and auto-fix every file hk knows about"
# hk's git hooks never fire under jj, which does not run `git commit`, so
# formatting is a task you run, not a hook that runs itself.
run = "hk fix --all"

[tasks.lint]
description = "Check formatting and lint without changing anything"
run = "hk check --all"

[tasks.clippy]
description = "Run clippy (compiles the workspace)"
# Not an hk step: clippy cannot lint without compiling, and `lint` should not
# start a build.
run = "cargo clippy --workspace --all-targets -- -D warnings"

# ── Docker ───────────────────────────────────────────────────
[tasks."docker:up"]
description = "Start dev dependencies"
run = "docker compose up -d"

[tasks."docker:down"]
description = "Stop dev dependencies"
run = "docker compose down"
