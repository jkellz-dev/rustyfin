[workspace]
members = [
    "crates/rustyfin-server",
    "crates/rustyfin-api",
    "crates/rustyfin-auth",
    "crates/rustyfin-core",
    "crates/rustyfin-db",
    "crates/rustyfin-models",
    "crates/rustyfin-search",
    "crates/rustyfin-media",
    "crates/rustyfin-frontend",
    "crates/rustyfin-common",
    "crates/rustyfin-meta",
]
exclude = ["frontend"]
resolver = "2"

# Dev builds keep only line tables: full DWARF (the default, debug = 2) is the
# single largest share of rustc's peak memory on this workspace, and these
# builds run inside a container alongside the server and tests. Backtraces
# and panics still show file:line; stepping through variables in a debugger
# needs a one-off `CARGO_PROFILE_DEV_DEBUG=2 cargo build`. Release is left at
# its defaults on purpose: the published image is built in CI, not here.
[profile.dev]
debug = "line-tables-only"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal crates
rustyfin-api = { path = "crates/rustyfin-api" }
rustyfin-auth = { path = "crates/rustyfin-auth" }
rustyfin-core = { path = "crates/rustyfin-core" }
rustyfin-db = { path = "crates/rustyfin-db" }
rustyfin-models = { path = "crates/rustyfin-models" }
rustyfin-search = { path = "crates/rustyfin-search", features = ["meilisearch"] }
rustyfin-media = { path = "crates/rustyfin-media" }
rustyfin-frontend = { path = "crates/rustyfin-frontend" }
rustyfin-common = { path = "crates/rustyfin-common" }

# Server
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
cron = "0.15"
async-trait = "0.1"
thiserror = "2"
sha2 = "0.10"
anyhow = "1"
walkdir = "2"
regex = "1"
futures-util = "0.3"
quick-xml = { version = "0.37", features = ["serialize"] }
rust-embed = { version = "8", features = ["axum"] }
mime_guess = "2"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
ipnet = "2"
lofty = "0.22"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", features = ["toml"] }
governor = "0.10"
dialoguer = "0.11"
open = "5"
serde_urlencoded = "0.7"
