[workspace]
members = [
    "crates/rustyfin-server",
    "crates/rustyfin-api",
    "crates/rustyfin-auth",
    "crates/rustyfin-core",
    "crates/rustyfin-db",
    "crates/rustyfin-models",
    "crates/rustyfin-search",
    "crates/rustyfin-media",
    "crates/rustyfin-frontend",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal crates
rustyfin-api = { path = "crates/rustyfin-api" }
rustyfin-auth = { path = "crates/rustyfin-auth" }
rustyfin-core = { path = "crates/rustyfin-core" }
rustyfin-db = { path = "crates/rustyfin-db" }
rustyfin-models = { path = "crates/rustyfin-models" }
rustyfin-search = { path = "crates/rustyfin-search" }
rustyfin-media = { path = "crates/rustyfin-media" }
rustyfin-frontend = { path = "crates/rustyfin-frontend" }

# Server
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
thiserror = "2"
anyhow = "1"
walkdir = "2"
regex = "1"
