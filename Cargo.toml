[workspace]
members = [
    "crates/rustyfin-server",
    "crates/rustyfin-jellyfin",
    "crates/rustyfin-api",
    "crates/rustyfin-services",
    "crates/rustyfin-data",
    "crates/rustyfin-models",
    "crates/rustyfin-media",
    "crates/rustyfin-frontend",
    "crates/rustyfin-common",
    "crates/rustyfin-meta",
    "crates/rustyfin-bench",
]
exclude = ["frontend"]
resolver = "2"

# Dev builds keep only line tables: full DWARF (the default, debug = 2) is the
# single largest share of rustc's peak memory on this workspace, and these
# builds run inside a container alongside the server and tests. Backtraces
# and panics still show file:line; stepping through variables in a debugger
# needs a one-off `CARGO_PROFILE_DEV_DEBUG=2 cargo build`. Release is left at
# its defaults on purpose: the published image is built in CI, not here.
[profile.dev]
debug = "line-tables-only"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Prometheus metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Internal crates
rustyfin-jellyfin = { path = "crates/rustyfin-jellyfin" }
rustyfin-api = { path = "crates/rustyfin-api" }
rustyfin-services = { path = "crates/rustyfin-services" }
rustyfin-data = { path = "crates/rustyfin-data" }
rustyfin-models = { path = "crates/rustyfin-models" }
rustyfin-media = { path = "crates/rustyfin-media" }
rustyfin-frontend = { path = "crates/rustyfin-frontend" }
rustyfin-common = { path = "crates/rustyfin-common" }

# Server
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }

# Utilities
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Traces to an OpenTelemetry collector (`[tracing] otlp_endpoint`).
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
rand = "0.10"
cron = "0.17"
async-trait = "0.1"
thiserror = "2"
sha2 = "0.11"
anyhow = "1"
walkdir = "2"
regex = "1"
futures-util = "0.3"
quick-xml = { version = "0.42", features = ["serialize"] }
rust-embed = { version = "8", features = ["axum"] }
mime_guess = "2"
flate2 = "1"
brotli = "9"
ipnet = "2"
lofty = "0.25"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", features = ["toml"] }
governor = "0.10"
dialoguer = "0.12"
open = "5"
serde_urlencoded = "0.7"
