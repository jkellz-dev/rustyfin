[package]
name = "rustyfin-bench"
description = "Reproducible benchmark: scan and browse a generated library (`mise run bench`)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rustyfin-bench"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
toml = { version = "1.2", default-features = false, features = ["std", "serde", "display"] }
