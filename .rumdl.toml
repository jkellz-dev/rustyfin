# rumdl settings, used by hk's rumdl step (`mise run format`).
#
# A project config replaces the global one (rumdl does not merge them), so the
# rule choices below repeat the global baseline on purpose.

[global]
exclude = [
    # Generated by git-cliff in CI: a reformat would be overwritten by, and
    # fight with, the next release.
    "CHANGELOG.md",
    # Historical plan records, kept as they were written.
    "docs/plans",
]
# MD024 (duplicate heading text): repeated section names across separate
#   sections are common and intentional.
# MD025 (multiple top-level H1): doc imports legitimately carry more than one.
# MD060 (table pipe alignment): aligned pipes are impractical for wide tables.
disable = ["MD024", "MD025", "MD060"]
line-length = 120

# MD013: reflow lets `--fix` wrap long prose lines. Code blocks and tables are
# exempt: code cannot wrap safely, and table cells cannot reflow.
[MD013]
code-blocks = false
heading-line-length = 120
line-length = 120
reflow = true
tables = false

# MD033: permit only <br>, for line breaks inside table cells.
[MD033]
allowed-elements = ["br"]
