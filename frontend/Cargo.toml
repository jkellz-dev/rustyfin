[package]
name = "rustyfin-admin"
version = "0.1.0"
edition = "2024"

[dependencies]
sycamore = "0.9"
sycamore-router = "0.9"
gloo-net = { version = "0.6", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
