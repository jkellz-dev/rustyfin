# release-plz: versions and tags (docs/contributing.md, "Releases").
#
# Rustyfin is one product: every crate shares the workspace version and there
# is one tag, vX.Y.Z. Nothing goes to a cargo registry (git_only: versions come
# from the tags). The release-pr job in .github/workflows/ci.yml opens the
# release PR; merging it makes the release job tag that commit and publish the
# GitHub release, its binaries and versioned images.
#
# CHANGELOG.md is written by git-cliff from cliff.toml, not by release-plz:
# release-plz's changelog lists only commits that touch a crate, and would miss
# the admin (frontend/), the docs and CI. ci.yml regenerates it on the release
# PR branch.
[workspace]
git_only = true
# Release only when a release PR is merged, not on every push to main.
release_always = false
semver_check = false
# Dependabot keeps the lockfile current; the release PR changes versions only.
dependencies_update = false
changelog_update = false
git_tag_name = "v{{ version }}"
# One tag for the product, made by rustyfin-server below.
git_tag_enable = false
# The release job in ci.yml creates the release, with git-cliff's notes and the
# binaries.
git_release_enable = false
pr_labels = ["release"]

[[package]]
name = "rustyfin-server"
git_tag_enable = true

# A developer tool (`mise run bench`), never released. In git-only mode
# release-plz looks every package up at the newest tag matching its
# git_tag_name, and the product's vX.Y.Z tags predate this crate. Its own tag
# name has no tags, so release-plz takes it as new; `release = false` then
# leaves it alone.
[[package]]
name = "rustyfin-bench"
release = false
git_tag_name = "rustyfin-bench-v{{ version }}"

# Crates of the layered split (CLAUDE.md) that are newer than the newest vX.Y.Z
# tag, so release-plz cannot find them there. They share the workspace version
# and ship inside rustyfin-server, so they need no release or tag of their own;
# the same entry goes here for each new crate until a product tag contains it.
[[package]]
name = "rustyfin-data"
release = false
git_tag_name = "rustyfin-data-v{{ version }}"

[[package]]
name = "rustyfin-services"
release = false
git_tag_name = "rustyfin-services-v{{ version }}"
