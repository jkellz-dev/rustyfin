# release-plz: versions, CHANGELOG.md and GitHub releases (docs/contributing.md,
# "Releases"). Rustyfin is one product: every crate shares the workspace
# version, there is one tag (vX.Y.Z) and one changelog at the root. Nothing is
# published to a cargo registry: versions come from the git tags.
[workspace]
git_only = true
# Release only when the release PR is merged, not on every push to main.
release_always = false
semver_check = false
# Dependabot keeps the lockfile current; the release PR does not update it.
dependencies_update = false
git_tag_name = "v{{ version }}"
# Only rustyfin-server (below) writes the changelog, tags and releases; the
# other crates find their version through the same vX.Y.Z tag.
changelog_update = false
git_tag_enable = false
git_release_enable = false
changelog_path = "./CHANGELOG.md"
pr_labels = ["release"]

[[package]]
name = "rustyfin-server"
changelog_update = true
changelog_include = [
  "rustyfin-api",
  "rustyfin-auth",
  "rustyfin-common",
  "rustyfin-core",
  "rustyfin-db",
  "rustyfin-frontend",
  "rustyfin-media",
  "rustyfin-meta",
  "rustyfin-models",
  "rustyfin-search",
]
git_tag_enable = true
git_release_enable = true
git_release_name = "v{{ version }}"

[changelog]
header = """# Changelog

All notable changes to Rustyfin. The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and
versions follow [Semantic Versioning](https://semver.org/spec/v2.0.0.html). Entries are generated from the
conventional commit subjects by release-plz.
"""
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^build", group = "<!-- 5 -->Build" },
  { message = "^ci", group = "<!-- 6 -->CI" },
  # Tests, style and chores (release commits included) stay out of the notes.
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
]
