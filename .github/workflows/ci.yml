name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Stub frontend dist
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Stub frontend dist
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Run unit tests
        run: cargo test --lib

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rustyfin_test
          POSTGRES_USER: rustyfin
          POSTGRES_PASSWORD: rustyfin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rustyfin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://rustyfin:rustyfin@localhost:5432/rustyfin_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run integration tests
        run: cargo test -p rustyfin-api --test '*' -- --test-threads=1

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build frontend
        working-directory: frontend
        run: trunk build --release

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [lint, test-unit, test-integration, build-frontend]
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Build binaries
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/rustyfin-server artifacts/rustyfin-server-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/rustyfin artifacts/rustyfin-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/
          retention-days: 1

  container-push:
    name: Push Container (${{ matrix.image }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build]
    strategy:
      matrix:
        include:
          - image: rustyfin-server
            dockerfile: docker/server.Dockerfile
            binary_amd64: rustyfin-server-x86_64-unknown-linux-gnu
            binary_arm64: rustyfin-server-aarch64-unknown-linux-gnu
            binary_name: rustyfin-server
          - image: rustyfin-meta
            dockerfile: docker/meta.Dockerfile
            binary_amd64: rustyfin-x86_64-unknown-linux-gnu
            binary_arm64: rustyfin-aarch64-unknown-linux-gnu
            binary_name: rustyfin
    steps:
      - uses: actions/checkout@v4

      - name: Determine tags
        id: tags
        run: |
          IMAGE="ghcr.io/jkellz-dev/${{ matrix.image }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS="${IMAGE}:sha-${SHORT_SHA}"

          # Always tag main pushes as :latest
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            TAGS="${TAGS},${IMAGE}:${VERSION}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: artifacts/amd64/

      - uses: actions/download-artifact@v4
        with:
          name: binaries-aarch64-unknown-linux-gnu
          path: artifacts/arm64/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build context
        run: |
          mkdir -p context/linux/{amd64,arm64}
          cp artifacts/amd64/${{ matrix.binary_amd64 }} context/linux/amd64/${{ matrix.binary_name }}
          cp artifacts/arm64/${{ matrix.binary_arm64 }} context/linux/arm64/${{ matrix.binary_name }}
          cp -r migrations context/migrations
          chmod +x context/linux/*/${{ matrix.binary_name }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: context
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container-push]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semver tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'; then
            echo "::error::Tag '$TAG' is not a valid semver version"
            exit 1
          fi
          echo "Version: $TAG"

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Determine changelog range
        id: cliff_args
        run: |
          TAG="${GITHUB_REF_NAME}"
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            # Stable release: include everything since last stable tag
            # (skip prereleases when finding the previous boundary)
            PREV=$(git tag -l 'v[0-9]*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -v "^${TAG}$" \
              | head -1)
            if [ -n "$PREV" ]; then
              echo "args=${PREV}..${TAG} --strip header" >> "$GITHUB_OUTPUT"
            else
              echo "args=--latest --strip header" >> "$GITHUB_OUTPUT"
            fi
          else
            # Prerelease: just the delta since the last tag (any kind)
            echo "args=--latest --strip header" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.cliff_args.outputs.args }}

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet && echo "No changelog changes" || {
            git commit -m "docs: update CHANGELOG.md for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          }

      - name: Annotate tag with release notes
        env:
          NOTES: ${{ steps.changelog.outputs.content }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          git tag -d "$TAG"
          git tag -a "$TAG" -m "$NOTES"
          git push origin "$TAG" --force

      - name: Determine prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release-artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${{ steps.changelog.outputs.content }}" \
            ${{ steps.prerelease.outputs.flag }} \
            release-artifacts/*
