name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push cancels a pull request's run. On main, runs queue instead: the
# release job runs only on the run for a merged release PR, and a cancelled
# run would skip that release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default: a job that publishes asks for its own write scope.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Cargo 1.100 writes fingerprints under build/<pkg>/<hash>/fingerprint. The
  # mr-boxington action (v1.7.3) saves its cache only when target/ holds a
  # `.fingerprint` directory, so on 1.100 it found nothing, logged "No reusable
  # Cargo target state was produced" and never saved. This switch (temporary
  # in Cargo) restores the layout the action reads. Remove it once the action
  # understands the new layout. Workflow-wide so every Cargo invocation,
  # including the ones trunk makes, writes the layout the action saves.
  __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          components: rustfmt, clippy

      # Compile cache, restored and saved per job. The action's restore prefix is
      # <os>-<arch>-mbx-<generation>-<toolchain>-, so the job name has to sit in
      # the generation: a suffix after the commit sha names the saved entry but
      # every job would still restore the newest entry of any job (lint pulled
      # the 1.2 GB integration tree). After the toolchain step: keys include the
      # rustc on PATH. Unit and integration build the same host `test` profile,
      # so they share one generation and differ only in the suffix: each restores
      # the other's newest entry and both still save their own.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          cache-generation: v1-lint

      - name: Stub frontend dist
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: mbx clippy -- -D warnings

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same disk squeeze as the integration tests: run 43637105389 died with "No
      # space left on device" before the tests started (the restored build cache
      # filled the runner).
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          (sudo rm -rf /usr/local/lib/android > /dev/null 2>&1 &)
          df -h /
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          cache-generation: v1-test
          cache-key-suffix: unit

      - name: Stub frontend dist
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Run unit tests
        run: mbx test --lib

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rustyfin_test
          POSTGRES_USER: rustyfin
          POSTGRES_PASSWORD: rustyfin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rustyfin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://rustyfin:rustyfin@localhost:5432/rustyfin_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every integration test is its own binary, each linked with full debug
      # info; with ~50 of them the runner's disk ran out mid-link ("ld
      # terminated with signal 7 [Bus error]", mbx: 4.5 GiB free). Drop the
      # preinstalled SDKs this job never uses: dotnet, GHC and CodeQL now,
      # Android (the biggest, slow to delete) in the background while we build.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          (sudo rm -rf /usr/local/lib/android > /dev/null 2>&1 &)
          df -h /
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          cache-generation: v1-test
          cache-key-suffix: integration

      - name: Run integration tests
        run: mbx test -p rustyfin-api --test '*' -- --test-threads=1

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          targets: wasm32-unknown-unknown

      # The frontend is its own Cargo workspace (excluded from the root one), so
      # its outputs live in frontend/target: name that workspace or nothing is saved.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          working-directory: frontend
          cache-generation: v1-frontend

      # trunk runs plain `cargo`, which would bypass mbx. `mbx setup` installs a
      # Cargo shim that runs mbx; putting it first on PATH routes trunk's cargo
      # through the cache (wasm32 links are cached too, they need no linker).
      - name: Route plain cargo through mbx
        run: |
          mbx setup --yes
          echo "$HOME/.local/share/mbx/bin" >> "$GITHUB_PATH"

      - name: Install trunk
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: trunk

      - name: Build frontend
        working-directory: frontend
        run: |
          command -v cargo   # must be the mbx shim, not ~/.cargo/bin/cargo
          trunk build --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The same Debian the containers run on (docker/*.Dockerfile: bookworm-slim),
    # so the binaries link against the glibc they will find at runtime (2.36).
    # `cross` used to do this inside its own Docker image, where mbx could not
    # see the compiler; building here lets mbx cache every compilation.
    container:
      image: docker.io/library/rust:1.100.0-slim-bookworm@sha256:7c7d4eb4d05b7781187a327809466cfddf29753f6defdc3d19a0e291951b7a37
    if: github.event_name == 'push'
    needs: [lint, test-unit, test-integration, build-frontend]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross_packages: ''
          - target: aarch64-unknown-linux-gnu
            cross_packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    env:
      # Only consulted when the target is aarch64: the linker for the final
      # binaries, and the C toolchain for ring's and sqlite's build scripts.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      # Before checkout: the slim image has no git, and checkout wants one.
      - name: Install build packages
        env:
          CROSS_PACKAGES: ${{ matrix.cross_packages }}
        run: |
          apt-get update -qq
          # shellcheck disable=SC2086 # a space-separated package list on purpose
          apt-get install -y -qq --no-install-recommends git ca-certificates pkg-config $CROSS_PACKAGES

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image carries the pinned 1.100.0 toolchain (rust-toolchain.toml);
      # only the cross target needs adding.
      - name: Add target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          cache-generation: v1-build-${{ matrix.target }}
          # mbx's own store, not a pruned target/: the target payload left mbx with
          # nothing to look up (0 hits) and Cargo still recompiled ~90 units a run.
          github-cache-mode: objects

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Build binaries
        env:
          TARGET: ${{ matrix.target }}
          # Full per-crate cache report: why a warm restore still recompiles deps.
          MBX_SUMMARY: full
        run: mbx build --release --locked --target "$TARGET"
      - name: Explain uncached work
        if: always()
        run: mbx analyze || true

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/rustyfin-server artifacts/rustyfin-server-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/rustyfin artifacts/rustyfin-${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/
          retention-days: 1

  # The Debian layers both images start from (docker/base.Dockerfile). They are
  # rebuilt only when that file changes or a new month starts (Debian security
  # updates); otherwise this job finds them in GHCR and builds nothing. It runs
  # beside the binary builds, so even a rebuild (apt under arm64 emulation, the
  # slow part) rarely adds to the run.
  base-images:
    name: Base Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write # push base images to GHCR
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Base image key
        id: key
        run: |
          KEY="$(date -u +%Y%m)-$(sha256sum docker/base.Dockerfile | cut -c1-12)"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for existing base images
        id: existing
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          BASE=ghcr.io/jkellz-dev/rustyfin-base
          if docker manifest inspect "${BASE}:server-${KEY}" > /dev/null 2>&1 \
            && docker manifest inspect "${BASE}:meta-${KEY}" > /dev/null 2>&1; then
            echo "Base images ${KEY} exist; nothing to build."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build & push meta base
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/base.Dockerfile
          target: meta
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jkellz-dev/rustyfin-base:meta-${{ steps.key.outputs.key }}
            ghcr.io/jkellz-dev/rustyfin-base:meta-latest

      - name: Build & push server base
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/base.Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jkellz-dev/rustyfin-base:server-${{ steps.key.outputs.key }}
            ghcr.io/jkellz-dev/rustyfin-base:server-latest

  container-push:
    name: Push Container (${{ matrix.image }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build, base-images]
    permissions:
      contents: read
      packages: write # push images to GHCR
    strategy:
      matrix:
        include:
          - image: rustyfin-server
            base: server
            dockerfile: docker/server.Dockerfile
            binary_amd64: rustyfin-server-x86_64-unknown-linux-gnu
            binary_arm64: rustyfin-server-aarch64-unknown-linux-gnu
            binary_name: rustyfin-server
          - image: rustyfin-meta
            base: meta
            dockerfile: docker/meta.Dockerfile
            binary_amd64: rustyfin-x86_64-unknown-linux-gnu
            binary_arm64: rustyfin-aarch64-unknown-linux-gnu
            binary_name: rustyfin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine tags
        id: tags
        run: |
          IMAGE="ghcr.io/jkellz-dev/${{ matrix.image }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS="${IMAGE}:sha-${SHORT_SHA}"

          # Always tag main pushes as :latest
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: artifacts/amd64/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-aarch64-unknown-linux-gnu
          path: artifacts/arm64/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No QEMU: the image only copies binaries onto the base, so nothing runs
      # for arm64 and no emulation is needed.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build context
        run: |
          mkdir -p context/linux/{amd64,arm64}
          cp artifacts/amd64/${{ matrix.binary_amd64 }} context/linux/amd64/${{ matrix.binary_name }}
          cp artifacts/arm64/${{ matrix.binary_arm64 }} context/linux/arm64/${{ matrix.binary_name }}
          cp -r migrations context/migrations
          chmod +x context/linux/*/${{ matrix.binary_name }}

      - name: Build & push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BASE_IMAGE=ghcr.io/jkellz-dev/rustyfin-base:${{ matrix.base }}-${{ needs.base-images.outputs.key }}

  # release-plz (release-plz.toml) keeps a release PR open with the next
  # version, from the conventional commits since the last tag. git-cliff then
  # rewrites CHANGELOG.md on that branch from every commit (release-plz's own
  # changelog would list only commits that touch a crate).
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write # push the release branch
      pull-requests: write # open and update the release PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Kept on purpose: the changelog step pushes to the release branch.
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0

      - name: Open or update the release PR
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out the release branch
        id: branch
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          BRANCH=$(jq -r '.head_branch' <<<"$PR")
          VERSION=$(jq -r '.releases[0].version' <<<"$PR")
          git fetch origin "$BRANCH"
          git switch "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write the changelog
        if: steps.release-plz.outputs.prs_created == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --tag ${{ steps.branch.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit the changelog to the release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          TAG: ${{ steps.branch.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: changelog for ${TAG}"
          git push origin "HEAD:${BRANCH}"

  # On the run for a merged release PR: release-plz tags the commit (vX.Y.Z),
  # then this job publishes the GitHub release with git-cliff's notes and the
  # binaries this run built, and adds the version to both images. On any other
  # push release-plz finds no release PR and the remaining steps skip.
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [container-push]
    permissions:
      contents: write # tag and create the release
      packages: write # add the version tag to the images
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0

      - name: Tag a merged release PR
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the tag
        id: tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          TAG=$(jq -r '.[0].tag' <<<"$RELEASES")
          git fetch --tags origin
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release notes
        id: notes
        if: steps.release-plz.outputs.releases_created == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.release-plz.outputs.releases_created == 'true'
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release-artifacts/

      - name: Create the GitHub release
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.content }}
        run: gh release create "$TAG" --title "$TAG" --notes "$NOTES" --verify-tag release-artifacts/*

      - name: Log in to GHCR
        if: steps.release-plz.outputs.releases_created == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.release-plz.outputs.releases_created == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Add the version to the images
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          for IMAGE in rustyfin-server rustyfin-meta; do
            docker buildx imagetools create \
              --tag "ghcr.io/jkellz-dev/${IMAGE}:${TAG}" \
              "ghcr.io/jkellz-dev/${IMAGE}:sha-${SHORT_SHA}"
          done
